name: WeatherApp-iOS
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: 1.6.0

targets:
  WeatherApp-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WeatherApp-iOS
    info:
      path: WeatherApp-iOS/Info.plist
      properties:
        CFBundleDisplayName: WeatherApp
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: Usamos a tua localização para mostrar automaticamente o tempo onde estás.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        API_BASE_URL: $(WEATHER_API_BASE_URL)
        MICROSOFT_CLIENT_ID: $(MICROSOFT_CLIENT_ID)
        # Google Sign-In needs both: GIDClientID so the SDK knows which OAuth client it's
        # authenticating as, and the reversed-client-id URL scheme so Google's auth page can
        # redirect back into this app. Both are empty (Sign in with Google button just won't work)
        # until a real iOS OAuth client id exists in Google Cloud Console -- see GoogleSignIn docs.
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          # MSAL's required redirect scheme, "msauth.<bundle-id>" -- must be registered as a
          # redirect URI "msauth.dev.ividi.weatherapp://auth" on the iOS platform in Azure too.
          - CFBundleURLSchemes:
              - msauth.dev.ividi.weatherapp
        # Lets MSAL detect whether Microsoft Authenticator/Company Portal are installed, so it can
        # hand off to them instead of always falling back to an in-app web view.
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.weatherapp
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Overridable per build configuration (e.g. a local xcconfig for a Debug build pointed at
        # a staging/local backend) without editing source -- APIClient reads this via Info.plist.
        WEATHER_API_BASE_URL: https://weatherapi-4r5x.onrender.com
        # From the WeatherApp Google Cloud project's iOS-type OAuth client (bundle id
        # dev.ividi.weatherapp), console.cloud.google.com/auth/clients.
        GOOGLE_IOS_CLIENT_ID: 903528455980-kg0ka4ohf7auuei1j3a9p08e86akfatv.apps.googleusercontent.com
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.903528455980-kg0ka4ohf7auuei1j3a9p08e86akfatv
        # Same Azure app registration already used by the Web client (next.config.ts /
        # social-auth.ts) -- Azure lets one Application (client) ID serve multiple platforms, each
        # with its own registered redirect URI.
        MICROSOFT_CLIENT_ID: 6c9a1a6d-70c4-4be1-8960-ae3869a8d74f
        # App Group shared with WeatherWidgetExtension (see WeatherApp-iOS.entitlements /
        # Shared/WeatherWidgetSnapshot.swift) -- lets the widget read the last weather the
        # app itself fetched without talking to the network on its own.
        CODE_SIGN_ENTITLEMENTS: WeatherApp-iOS/WeatherApp-iOS.entitlements
    dependencies:
      - target: WeatherWidgetExtension
        embed: true
      - sdk: WidgetKit.framework
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: MSAL
        product: MSAL

  WeatherWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WeatherWidget
      # Shared with the main app target (see project.yml's WeatherApp-iOS sources): the
      # App-Group-backed snapshot model, plus two small self-contained styling/formatting
      # helpers reused as-is so the widget's colors/icons/rounding match the main app
      # instead of drifting into a second copy of the same rules.
      - path: WeatherApp-iOS/Shared
      - path: WeatherApp-iOS/Utilities/WeatherConditionStyle.swift
      - path: WeatherApp-iOS/Utilities/NumberFormatting.swift
    info:
      path: WeatherWidget/Info.plist
      properties:
        CFBundleDisplayName: WeatherWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.weatherapp.WeatherWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: WeatherWidget/WeatherWidget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  WeatherApp-iOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WeatherApp-iOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.weatherapp.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WeatherApp-iOS

  WeatherApp-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WeatherApp-iOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.weatherapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WeatherApp-iOS
    dependencies:
      - target: WeatherApp-iOS

schemes:
  WeatherApp-iOS:
    build:
      targets:
        WeatherApp-iOS: all
        WeatherApp-iOSTests: [test]
        WeatherApp-iOSUITests: [test]
    test:
      targets:
        - WeatherApp-iOSTests
        - WeatherApp-iOSUITests
    run:
      config: Debug

  WeatherWidgetExtension:
    build:
      targets:
        WeatherWidgetExtension: all
    run:
      config: Debug
